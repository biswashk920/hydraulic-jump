const LEARN=`<section><details><summary><b>Learn: the ideas behind the figures</b></summary><div class="k" style="line-height:1.55;margin-top:.6rem">
<p><b>Specific energy</b> E = y + V²/2g is the energy per unit weight measured from the bed. For a fixed discharge it has a minimum at <b>critical depth</b> (Fr = 1). Every larger E is carried at two depths: a deep slow one (subcritical) and a shallow fast one (supercritical).</p>
<p><b>Normal depth</b> is the depth of steady uniform flow (Manning's equation) and exists only on a falling bed. Comparing it with critical depth classifies the slope: <b>mild</b> (yn &gt; yc), <b>steep</b> (yn &lt; yc), <b>critical</b> (equal), <b>horizontal</b> or <b>adverse</b> (no normal depth).</p>
<p><b>Gradually varied flow.</b> When the depth is not the normal depth it changes slowly along the channel, dy/dx = (S₀ − S<sub>f</sub>)/(1 − Fr²). The sign tells the shape. The curves are named by slope letter and zone: zone 1 above both normal and critical depth, zone 2 between them, zone 3 below both.</p>
<table><tr><th>Slope</th><th>Zone 1</th><th>Zone 2</th><th>Zone 3</th></tr><tr><td>Mild</td><td>M1 (backwater)</td><td>M2 (drawdown)</td><td>M3</td></tr><tr><td>Steep</td><td>S1</td><td>S2</td><td>S3</td></tr><tr><td>Critical</td><td>C1</td><td>none</td><td>C3</td></tr><tr><td>Horizontal / adverse</td><td>none</td><td>H2 / A2</td><td>H3 / A3</td></tr></table>
<p><b>Standard step method.</b> Between two stations the energy equation z₁ + y₁ + V₁²/2g = z₂ + y₂ + V₂²/2g + S̄<sub>f</sub>Δx is solved for the unknown depth. Subcritical flow is calculated <i>upstream</i> from a downstream control, supercritical flow <i>downstream</i> from an upstream control, because that is the direction information travels.</p>
<p><b>Hydraulic jump.</b> When fast flow meets a deep tailwater it jumps to the sequent depth y₂, found by equal momentum. Energy is lost (turbulent roller), so E before and after differ, but M does not. The jump forms where the supercritical flow and the tailwater profile have equal M; it has a length of roughly 6·y₂, and the upstream Froude number gives its type (undular &lt; 1.7, weak &lt; 2.5, oscillating &lt; 4.5, steady &lt; 9, strong).</p>
<p><b>Limits.</b> Steady, one-dimensional, gradually varied flow; prismatic reaches; no sediment, side inflow or losses at changes of section; the jump uses the horizontal-floor momentum equation and an empirical length; the roller shape and foam in the 3D view are illustrations.</p></div></details></section>`;
